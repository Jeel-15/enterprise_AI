[project]
name = "ai-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeel Patel", email = "jeelpatel1507@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.4.0",
    "fastapi>=0.142.4",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-platform = "ai_platform:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.7",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
